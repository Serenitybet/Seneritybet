version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: serenitybet_postgres
    environment:
      POSTGRES_USER: serenitybet
      POSTGRES_PASSWORD: serenitybet
      POSTGRES_DB: serenitybet_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serenitybet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: serenitybet_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Outil de développement local uniquement — jamais destiné à tourner sur un
  # serveur de production (accès direct à toute la base). Lié à 127.0.0.1 et
  # identifiants fournis via .env, pour ne jamais republier par erreur un
  # compte admin par défaut sur Internet (cf. audit de sécurité du 04/11/2026).
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: serenitybet_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Définissez PGADMIN_DEFAULT_EMAIL dans .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Définissez PGADMIN_DEFAULT_PASSWORD dans .env}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
