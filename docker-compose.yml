version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: serenitybet_postgres
    environment:
      POSTGRES_USER: serenitybet
      POSTGRES_PASSWORD: serenitybet
      POSTGRES_DB: serenitybet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serenitybet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: serenitybet_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: serenitybet_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@serenitybet.td
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
